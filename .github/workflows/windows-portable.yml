name: Windows portable candidate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Upload portable candidate and checksums
        uses: actions/upload-artifact@v7
        with:
          name: TokenFish-win-x64
          path: artifacts/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
